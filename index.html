<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 맞추기 서바이벌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col sm:justify-center sm:items-center bg-gradient-to-br from-indigo-50 via-white to-blue-50 relative">

<div id="app-container" class="w-full h-full sm:w-[400px] sm:h-[750px] sm:rounded-3xl sm:shadow-2xl sm:border border-gray-100 bg-white relative overflow-hidden flex flex-col">

    <!-- 1. 시작 화면 -->
    <div id="screen-start" class="absolute inset-0 flex flex-col items-center justify-start p-6 fade-in z-10 bg-white overflow-y-auto">
        <div class="text-6xl mb-4 mt-6">🇯🇵</div>
        <h1 class="text-3xl font-black text-gray-800 mb-2 tracking-tight text-center">일본어 단어<br>200 퀴즈</h1>
        <p class="text-gray-500 mb-6 text-center text-sm leading-relaxed">200개의 단어의 뜻을 맞춰보세요</p>

        <div class="w-full mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">플레이어 닉네임</label>
            <input type="text" id="nickname-input" class="w-full bg-gray-50 border-2 border-gray-200 text-gray-800 text-center text-lg rounded-xl p-3 focus:outline-none focus:border-indigo-500 transition-all font-bold" placeholder="닉네임을 입력하세요" maxlength="10">
            <p id="nickname-error" class="text-red-500 text-xs mt-1 ml-1 hidden">닉네임을 입력해야 시작할 수 있습니다.</p>
        </div>

        <div class="flex w-full gap-2 mb-8">
            <button onclick="window.showVoca()" class="flex-1 bg-teal-50 hover:bg-teal-100 text-teal-600 font-bold py-3 px-4 rounded-xl transition-all active:scale-95 text-sm border border-teal-200">📖 단어장</button>
            <button onclick="window.startGame()" class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95 text-lg">도전 시작</button>
        </div>

        <div class="w-full flex-1 flex flex-col bg-gray-50 rounded-2xl p-4 border border-gray-100">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-xl">🏆</span>
                <h3 class="font-bold text-gray-800">최고기록 (Top 10)</h3>
                <span id="loading-ranking" class="text-xs text-indigo-500 ml-auto animate-pulse">불러오는 중...</span>
            </div>
            <div id="ranking-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <!-- 2. 게임 화면 -->
    <div id="screen-game" class="absolute inset-0 flex flex-col hidden bg-white z-10">
        <div class="p-5 flex justify-between items-center border-b border-gray-100 bg-white/80 backdrop-blur-sm z-20">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🔥</span>
                <span class="font-bold text-gray-700">현재 <span id="current-score" class="text-indigo-600 text-lg">0</span> 문제 돌파</span>
            </div>
            <div class="text-sm font-semibold text-gray-400 bg-gray-100 px-3 py-1 rounded-full">
                <span id="current-index-text">1</span> / 200
            </div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center p-6 relative">
            <div id="word-card" class="w-full bg-white rounded-3xl shadow-xl border border-gray-50 p-8 flex flex-col items-center pop-in relative overflow-hidden">
                <div class="absolute top-0 w-full h-2 bg-gradient-to-r from-indigo-400 to-blue-400"></div>
                <div id="word-jp" class="text-5xl font-black text-gray-800 mt-4 mb-3 tracking-widest text-center">-</div>
                <div id="word-pron" class="text-lg text-gray-400 font-medium mb-6 text-center">-</div>
                <div class="w-full relative mt-4">
                    <input type="text" id="answer-input"
                        class="w-full bg-gray-50 border-2 border-gray-200 text-gray-800 text-center text-xl rounded-2xl p-4 focus:outline-none focus:border-indigo-500 focus:bg-white transition-all font-bold placeholder-gray-300"
                        placeholder="한국어 뜻 입력"
                        autocomplete="off"
                        onkeypress="window.handleKeyPress(event)">
                </div>
            </div>

            <div id="checking-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm hidden flex items-center justify-center rounded-3xl z-30">
                <div class="flex flex-col items-center gap-3">
                    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-sm text-gray-500 font-medium">검증 중...</span>
                </div>
            </div>

            <div class="w-full flex mt-8">
                <button id="submit-btn" onclick="window.checkAnswer()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95 text-xl tracking-wide">
                    정답 입력
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="screen-result" class="absolute inset-0 flex flex-col items-center justify-center p-6 hidden bg-white z-10">
        <div id="result-emoji" class="text-7xl mb-4 pop-in">💀</div>
        <h2 id="result-title" class="text-3xl font-black text-gray-800 mb-2">게임 오버</h2>
        <p id="result-message" class="text-gray-500 text-center mb-8"></p>
        <div class="bg-indigo-50 rounded-3xl p-6 w-full max-w-sm mb-8 flex flex-col items-center border border-indigo-100 relative">
            <div class="absolute -top-3 bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">내 기록</div>
            <span id="result-nickname" class="text-indigo-400 font-bold text-sm mb-1 mt-2">Player</span>
            <div class="text-5xl font-black text-indigo-600 flex items-baseline gap-1">
                <span id="final-score">0</span><span class="text-xl text-indigo-400">문제</span>
            </div>
        </div>
        <button onclick="window.goToStart()" class="w-full max-w-sm bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition-all active:scale-95 text-lg mb-3">
            랭킹 확인 & 다시하기
        </button>
    </div>

    <!-- 4. 단어장 화면 -->
    <div id="screen-voca" class="absolute inset-0 flex flex-col hidden bg-white z-20">
        <div class="p-4 flex justify-between items-center border-b border-gray-200 bg-white">
            <h2 class="text-xl font-bold text-gray-800">📖 200단어 마스터장</h2>
            <button onclick="window.switchScreen('screen-start')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1 rounded-lg font-bold text-sm transition-all">닫기 ✕</button>
        </div>
        <!-- 로딩 -->
        <div id="voca-loading" class="flex flex-col items-center justify-center flex-1 gap-3">
            <div class="w-10 h-10 border-4 border-teal-400 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-sm text-gray-400">단어장 불러오는 중...</span>
        </div>
        <!-- 목록 -->
        <div class="flex-1 overflow-y-auto p-4 bg-gray-50 hidden" id="voca-scroll">
            <div id="voca-list" class="grid grid-cols-1 gap-2 pb-6"></div>
        </div>
    </div>

    <!-- 오답 알럿 -->
    <div id="custom-alert" class="absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-6 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 flex flex-col items-center transform scale-95 transition-transform duration-200" id="custom-alert-box">
            <div id="alert-emoji" class="text-5xl mb-3">❌</div>
            <h3 id="alert-title" class="text-xl font-bold text-gray-800 mb-2">오답입니다</h3>
            <p id="alert-message" class="text-gray-500 text-center mb-6 whitespace-pre-line leading-relaxed"></p>
            <button id="alert-btn" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl active:scale-95 transition-all">결과 보기</button>
        </div>
    </div>
</div>

    // ==========================================
    // 🏆 랭킹
    // ==========================================
    async function loadRankings() {
        const el = document.getElementById('loading-ranking');
        el.classList.remove('hidden');
        try {
            const q = query(collection(db, 'rankings'), orderBy('score', 'desc'), orderBy('createdAt', 'asc'), limit(10));
            const snap = await getDocs(q);
            renderRankings(snap.docs.map(d => d.data()));
        } catch(e) { console.error(e); }
        finally { el.classList.add('hidden'); }
    }

    function renderRankings(ranks) {
        const list = document.getElementById('ranking-list');
        list.innerHTML = '';
        if (!ranks.length) {
            list.innerHTML = '<div class="text-sm text-gray-400 text-center py-4">아직 기록이 없습니다. 첫 번째 랭커가 되어보세요!</div>';
            return;
        }
        ranks.forEach((rank, i) => {
            const isTop3 = i < 3;
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
            const item = document.createElement('div');
            item.className = `flex justify-between items-center p-3 rounded-xl ${isTop3 ? 'bg-white shadow-sm border border-indigo-50' : 'bg-transparent border-b border-gray-100'}`;
            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="${isTop3 ? 'text-xl' : 'text-gray-400 font-bold w-6 text-center'}">${medal}</span>
                    <span class="font-bold ${isTop3 ? 'text-indigo-900' : 'text-gray-700'}">${rank.nickname}</span>
                </div>
                <div class="font-black ${isTop3 ? 'text-indigo-600' : 'text-gray-500'}">${rank.score} <span class="text-xs font-normal">문제</span></div>
            `;
            list.appendChild(item);
        });
    }

    async function saveScore(nickname, score) {
        if (score === 0) return;
        try {
            await addDoc(collection(db, 'rankings'), {
                nickname, score,
                uid: currentUser?.uid || 'anonymous',
                createdAt: serverTimestamp()
            });
        } catch(e) { console.error('점수 저장 실패:', e); }
    }

    // ==========================================
    // ✅ 서버에서 정답 검증 (게임용)
    // ==========================================
    async function verifyAnswerOnServer(wordId, userInput) {
        const snap = await getDoc(doc(db, 'words', wordId));
        if (!snap.exists()) return { correct: false, correctAnswers: [] };
        const meanings = snap.data().meanings || [];
        return {
            correct: meanings.some(m => userInput.includes(m)),
            correctAnswers: meanings
        };
    }

    // ==========================================
    // 📖 단어장: Firestore에서 전체 불러오기
    // ==========================================
    async function loadVocaFromFirestore() {
        const loading = document.getElementById('voca-loading');
        const scroll = document.getElementById('voca-scroll');
        const container = document.getElementById('voca-list');

        loading.classList.remove('hidden');
        loading.innerHTML = `
            <div class="w-10 h-10 border-4 border-teal-400 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-sm text-gray-400">단어장 불러오는 중...</span>
        `;
        scroll.classList.add('hidden');
        container.innerHTML = '';

        try {
            const snap = await getDocs(collection(db, 'words'));
            const idMap = {};
            snap.docs.forEach(d => { idMap[d.id] = d.data(); });

            wordDisplayData.forEach((item, i) => {
                const data = idMap[item.id];
                const meanings = data?.meanings?.join(', ') || '-';
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between";
                div.innerHTML = `
                    <div class="flex items-baseline gap-2 mb-1 sm:mb-0">
                        <span class="text-xs text-gray-400 w-6">${i+1}.</span>
                        <span class="text-xl font-black text-gray-800">${item.word}</span>
                        <span class="text-sm text-gray-500">${item.pron}</span>
                    </div>
                    <div class="font-bold text-indigo-600 sm:text-right">${meanings}</div>
                `;
                container.appendChild(div);
            });

            loading.classList.add('hidden');
            scroll.classList.remove('hidden');
        } catch(e) {
            console.error('단어장 로드 실패:', e);
            loading.innerHTML = '<p class="text-red-400 text-sm text-center px-4">불러오기 실패. 잠시 후 다시 시도해주세요.</p>';
        }
    }

    // ==========================================
    // 게임 로직
    // ==========================================
    let playlist = [];
    let currentIndex = 0;
    let score = 0;
    let currentNickname = '';
    let isChecking = false;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    window.switchScreen = function(id) {
        ['screen-start','screen-game','screen-result','screen-voca'].forEach(s => {
            document.getElementById(s).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
        if (id === 'screen-game') {
            const card = document.getElementById('word-card');
            card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
        }
    };

    window.goToStart = function() { window.switchScreen('screen-start'); loadRankings(); };

    window.showVoca = function() {
        window.switchScreen('screen-voca');
        loadVocaFromFirestore();
    };

    window.startGame = function() {
        const nickInput = document.getElementById('nickname-input');
        const nickError = document.getElementById('nickname-error');
        const val = nickInput.value.trim();
        if (!val) {
            nickInput.classList.add('border-red-400','bg-red-50');
            nickError.classList.remove('hidden');
            nickInput.focus(); return;
        }
        nickInput.classList.remove('border-red-400','bg-red-50');
        nickError.classList.add('hidden');
        currentNickname = val;
        localStorage.setItem('survivalNickname', val);
        playlist = shuffle(wordDisplayData);
        currentIndex = 0; score = 0; isChecking = false;
        updateGameUI();
        window.switchScreen('screen-game');
    };

    function updateGameUI() {
        const w = playlist[currentIndex];
        document.getElementById('word-jp').innerText = w.word;
        document.getElementById('word-pron').innerText = w.pron;
        document.getElementById('current-index-text').innerText = currentIndex + 1;
        document.getElementById('current-score').innerText = score;
        const input = document.getElementById('answer-input');
        input.value = ''; input.focus();
    }

    window.handleKeyPress = function(e) { if (e.key === 'Enter') window.checkAnswer(); };

    window.checkAnswer = async function() {
        if (isChecking) return;
        const inputEl = document.getElementById('answer-input');
        const val = inputEl.value.trim();
        if (!val) return;

        isChecking = true;
        setLoadingState(true);

        try {
            const { correct, correctAnswers } = await verifyAnswerOnServer(playlist[currentIndex].id, val);
            if (correct) {
                score++;
                currentIndex++;
                if (currentIndex >= playlist.length) { endGame(true); }
                else { updateGameUI(); }
                isChecking = false;
            } else {
                const card = document.getElementById('word-card');
                card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
                showCustomAlert('오답입니다!', `정답은 '${correctAnswers.join(', ')}' 입니다.`, '💀', () => endGame(false));
            }
        } catch(e) {
            console.error(e);
            isChecking = false;
        } finally {
            setLoadingState(false);
        }
    };

    function setLoadingState(loading) {
        document.getElementById('checking-overlay').classList.toggle('hidden', !loading);
        document.getElementById('checking-overlay').classList.toggle('flex', loading);
        document.getElementById('submit-btn').disabled = loading;
        document.getElementById('answer-input').disabled = loading;
    }

    async function endGame(isAllClear = false) {
        isChecking = false;
        window.switchScreen('screen-result');
        document.getElementById('final-score').innerText = score;
        document.getElementById('result-nickname').innerText = currentNickname;
        await saveScore(currentNickname, score);
        if (isAllClear) {
            document.getElementById('result-emoji').innerText = '🎊';
            document.getElementById('result-title').innerText = '일본어 마스터!';
            document.getElementById('result-message').innerText = '믿을 수 없습니다! 200개의 단어를 완벽하게 맞추셨습니다!';
        } else {
            document.getElementById('result-emoji').innerText = '💀';
            document.getElementById('result-title').innerText = '게임 오버';
            document.getElementById('result-message').innerText = `연속 ${score}문제 정답 돌파! 수고하셨습니다.`;
        }
    }

    function showCustomAlert(title, message, emoji, onClose) {
        const bg = document.getElementById('custom-alert');
        const box = document.getElementById('custom-alert-box');
        document.getElementById('alert-title').innerText = title;
        document.getElementById('alert-message').innerText = message;
        document.getElementById('alert-emoji').innerText = emoji;
        bg.classList.remove('hidden');
        setTimeout(() => { bg.classList.remove('opacity-0'); box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
        const btn = document.getElementById('alert-btn');
        btn.onclick = () => {
            bg.classList.add('opacity-0'); box.classList.remove('scale-100'); box.classList.add('scale-95');
            setTimeout(() => { bg.classList.add('hidden'); if (onClose) onClose(); }, 200);
        };
        btn.focus();
    }

    window.onload = () => {
        const saved = localStorage.getItem('survivalNickname');
        if (saved) document.getElementById('nickname-input').value = saved;
        loadRankings();
    };
</script>
