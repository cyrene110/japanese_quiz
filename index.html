<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #818cf8; }
    </style>
</head>

                    <span class="font-bold text-gray-700">현재 <span id="current-score" class="text-indigo-600 text-lg">0</span> 문제 돌파</span>

        // 랭킹 불러오기
        async function loadRankings() {
            const loadingEl = document.getElementById('loading-ranking');
            loadingEl.classList.remove('hidden');
            loadingEl.textContent = '불러오는 중...';
            loadingEl.classList.add('animate-pulse');

            const { data, error } = await supabaseClient
                .from('survival_rankings')
                .select('nickname, score, created_at')
                .order('score', { ascending: false })
                .order('created_at', { ascending: true })
                .limit(10);

            loadingEl.classList.add('hidden');

            if (error) {
                console.error('랭킹 로드 실패 코드:', error.code);
                console.error('랭킹 로드 실패 메시지:', error.message);
                console.error('랭킹 로드 실패 상세:', error.details);
                loadingEl.textContent = `오류: ${error.message || '알 수 없음'}`;
                loadingEl.classList.remove('hidden', 'animate-pulse');
                return;
            }

            renderRankings(data || []);
        }

        // 랭킹 렌더링
        function renderRankings(ranks) {
            const listContainer = document.getElementById('ranking-list');
            listContainer.innerHTML = '';

            if (ranks.length === 0) {
                listContainer.innerHTML = '<div class="text-sm text-gray-400 text-center py-4">아직 기록이 없습니다. 첫 번째 랭커가 되어보세요!</div>';
                return;
            }

            ranks.forEach((rank, index) => {
                const isTop3 = index < 3;
                let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                let bgClass = isTop3 ? 'bg-white shadow-sm border border-indigo-50' : 'bg-transparent border-b border-gray-100 last:border-0';

                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-3 rounded-xl ${bgClass}`;
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="${isTop3 ? 'text-xl' : 'text-gray-400 font-bold w-6 text-center'}">${medal}</span>
                        <span class="font-bold ${isTop3 ? 'text-indigo-900' : 'text-gray-700'}">${rank.nickname}</span>
                    </div>
                    <div class="font-black ${isTop3 ? 'text-indigo-600' : 'text-gray-500'}">${rank.score} <span class="text-xs font-normal">문제</span></div>
                `;
                listContainer.appendChild(item);
            });
        }

            { word: 'たいよう', pron: 'taiyou (타이요우)', meanings: ['태양', '해'] }, { word: 'くさ', pron: 'kusa (쿠사)', meanings: ['풀'] }, { word: 'あたま', pron: 'atama (아타마)', meanings: ['머리'] }, { word: 'は', pron: 'ha (하)', meanings: ['치아', '이', '잎'] }, { word: 'おなか', pron: 'onaka (오나카)', meanings: ['배'] },
            { word: 'くび', pron: 'kubi (쿠비)', meanings: ['목'] }, { word: 'むね', pron: 'mune (무네)', meanings: ['가슴'] }, { word: 'ゆび', pron: 'yubi (유비)', meanings: ['손가락', '발가락'] }, { word: 'ほね', pron: 'hone (호네)', meanings: ['뼈'] }, { word: 'といれ', pron: 'toire (토이레)', meanings: ['화장실'] },
            { word: 'おふろ', pron: 'ofuro (오후로)', meanings: ['목욕', '욕조'] }, { word: 'だいどころ', pron: 'daidokoro (다이도코로)', meanings: ['부엌', '주방'] }, { word: 'べっど', pron: 'beddo (벳도)', meanings: ['침대'] }, { word: 'てれび', pron: 'terebi (테레비)', meanings: ['텔레비전', '티비', 'tv'] }, { word: 'でんわ', pron: 'denwa (덴와)', meanings: ['전화', '전화기'] },
            { word: 'しんぶん', pron: 'shinbun (신분)', meanings: ['신문'] }, { word: 'ざっし', pron: 'zasshi (잣시)', meanings: ['잡지'] }, { word: 'じしょ', pron: 'jisho (지쇼)', meanings: ['사전'] }, { word: 'ぺん', pron: 'pen (펜)', meanings: ['펜'] }, { word: 'かう', pron: 'kau (카우)', meanings: ['사다', '구입하다', '기르다'] },
            { word: 'かく', pron: 'kaku (카쿠)', meanings: ['쓰다', '그리다'] }, { word: 'よむ', pron: 'yomu (요무)', meanings: ['읽다'] }, { word: 'おきる', pron: 'okiru (오키루)', meanings: ['일어나다'] }, { word: 'ねる', pron: 'neru (네루)', meanings: ['자다', '눕다'] }, { word: 'かえる', pron: 'kaeru (카에루)', meanings: ['돌아가다', '돌아오다', '개구리'] },
            { word: 'およぐ', pron: 'oyogu (오요구)', meanings: ['헤엄치다', '수영하다'] }, { word: 'あそぶ', pron: 'asobu (아소부)', meanings: ['놀다'] }, { word: 'まつ', pron: 'matsu (마츠)', meanings: ['기다리다'] }, { word: 'のる', pron: 'noru (노루)', meanings: ['타다'] }, { word: 'おりる', pron: 'oriru (오리루)', meanings: ['내리다'] },
            { word: 'わかる', pron: 'wakaru (와카루)', meanings: ['알다', '이해하다'] }, { word: 'むずかしい', pron: 'muzukashii (무즈카시이)', meanings: ['어렵다'] }, { word: 'やさしい', pron: 'yasashii (야사시이)', meanings: ['쉽다', '다정하다', '상냥하다'] }, { word: 'とおい', pron: 'tooi (토오이)', meanings: ['멀다'] }, { word: 'ちかい', pron: 'chikai (치카이)', meanings: ['가깝다'] },
            { word: 'はやい', pron: 'hayai (하야이)', meanings: ['빠르다', '이르다'] }, { word: 'おそい', pron: 'osoi (오소이)', meanings: ['느리다', '늦다'] }, { word: 'いそがしい', pron: 'isogashii (이소가시이)', meanings: ['바쁘다'] }, { word: 'たのしい', pron: 'tanoshii (타노시이)', meanings: ['즐겁다'] }, { word: 'ぎんこう', pron: 'ginkou (긴코우)', meanings: ['은행'] },
            { word: 'としょかん', pron: 'toshokan (토쇼칸)', meanings: ['도서관'] }, { word: 'こうえん', pron: 'kouen (코우엔)', meanings: ['공원'] }, { word: 'まち', pron: 'machi (마치)', meanings: ['마을', '거리', '도시'] }, { word: 'くに', pron: 'kuni (쿠니)', meanings: ['나라', '국가'] }, { word: 'ひゃく', pron: 'hyaku (햐쿠)', meanings: ['100', '백'] },
            { word: 'せん', pron: 'sen (센)', meanings: ['1000', '천'] }, { word: 'まん', pron: 'man (만)', meanings: ['10000', '만'] }, { word: 'ことし', pron: 'kotoshi (코토시)', meanings: ['올해', '금년'] }, { word: 'らいねん', pron: 'rainen (라이넨)', meanings: ['내년'] }, { word: 'きょねん', pron: 'kyonen (쿄넨)', meanings: ['작년'] }
        ];

        // ==========================================
        // 🎮 게임 로직
        // ==========================================
        let currentPlaylist = [];
        let currentIndex = 0;
        let score = 0;
        let currentNickname = "";

        window.onload = () => {
            const savedNickname = localStorage.getItem('survivalNickname');
            if (savedNickname) document.getElementById('nickname-input').value = savedNickname;
            renderVocaList();
            loadRankings();
        };

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        window.switchScreen = function(screenId) {
            ['screen-start', 'screen-game', 'screen-result', 'screen-voca'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');

            if (screenId === 'screen-game') {
                const card = document.getElementById('word-card');
                card.classList.remove('pop-in');
                void card.offsetWidth;
                card.classList.add('pop-in');
            }
        };

        // 시작 화면으로 돌아갈 때 랭킹도 새로고침
        window.goToStart = function() {
            window.switchScreen('screen-start');
            loadRankings();
        };

        window.showVoca = function() {
            window.switchScreen('screen-voca');
        };

        function renderVocaList() {
            const container = document.getElementById('voca-list');
            originalWordData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between";
                div.innerHTML = `
                    <div class="flex items-baseline gap-2 mb-1 sm:mb-0">
                        <span class="text-xs text-gray-400 w-6">${index + 1}.</span>
                        <span class="text-xl font-black text-gray-800">${item.word}</span>
                        <span class="text-sm text-gray-500">${item.pron}</span>
                    </div>
                    <div class="font-bold text-indigo-600 sm:text-right">${item.meanings.join(', ')}</div>
                `;
                container.appendChild(div);
            });
        }

        window.startGame = function() {
            const nickInput = document.getElementById('nickname-input');
            const nickError = document.getElementById('nickname-error');
            const nickValue = nickInput.value.trim();

            if (!nickValue) {
                nickInput.classList.add('border-red-400', 'bg-red-50');
                nickError.classList.remove('hidden');
                nickInput.focus();
                return;
            }

            nickInput.classList.remove('border-red-400', 'bg-red-50');
            nickError.classList.add('hidden');

            currentNickname = nickValue;
            localStorage.setItem('survivalNickname', currentNickname);

            currentPlaylist = shuffle(originalWordData);
            currentIndex = 0;
            score = 0;
            updateGameUI();
            window.switchScreen('screen-game');
        };

        function updateGameUI() {
            const currentWord = currentPlaylist[currentIndex];
            document.getElementById('word-jp').innerText = currentWord.word;
            document.getElementById('word-pron').innerText = currentWord.pron;
            document.getElementById('current-index-text').innerText = currentIndex + 1;
            document.getElementById('current-score').innerText = score;
            const input = document.getElementById('answer-input');
            input.value = '';
            input.focus();
        }

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') window.checkAnswer();
        };

        window.checkAnswer = function() {
            const inputVal = document.getElementById('answer-input').value.trim();
            if (!inputVal) return;

            const currentWord = currentPlaylist[currentIndex];
            const isCorrect = currentWord.meanings.some(meaning => inputVal.includes(meaning));

            if (isCorrect) {
                score++;
                currentIndex++;
                if (currentIndex >= currentPlaylist.length) {
                    endGame(true);
                } else {
                    updateGameUI();
                }
            } else {
                const card = document.getElementById('word-card');
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                showCustomAlert("오답입니다!", `정답은 '${currentWord.meanings.join(', ')}' 입니다.`, "💀", () => endGame(false));
            }
        };

        async function endGame(isAllClear = false) {
            window.switchScreen('screen-result');
            document.getElementById('final-score').innerText = score;
            document.getElementById('result-nickname').innerText = currentNickname;

            await saveScoreToCloud(currentNickname, score);

            if (isAllClear) {
                document.getElementById('result-emoji').innerText = "🎊";
                document.getElementById('result-title').innerText = "일본어 마스터!";
                document.getElementById('result-message').innerText = "믿을 수 없습니다! 200개의 단어를 완벽하게 맞추셨습니다!";
            } else {
                document.getElementById('result-emoji').innerText = "💀";
                document.getElementById('result-title').innerText = "게임 오버";
                document.getElementById('result-message').innerText = `연속 ${score}문제 정답 돌파! 수고하셨습니다.`;
            }
        }

        function showCustomAlert(title, message, emoji, onClose) {
            const alertBg = document.getElementById('custom-alert');
            const alertBox = document.getElementById('custom-alert-box');

            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-emoji').innerText = emoji;

            alertBg.classList.remove('hidden');
            setTimeout(() => {
                alertBg.classList.remove('opacity-0');
                alertBox.classList.remove('scale-95');
                alertBox.classList.add('scale-100');
            }, 10);

            const btn = document.getElementById('alert-btn');
            btn.onclick = () => {
                alertBg.classList.add('opacity-0');
                alertBox.classList.remove('scale-100');
                alertBox.classList.add('scale-95');
                setTimeout(() => {
                    alertBg.classList.add('hidden');
                    if (onClose) onClose();
                }, 200);
            };
            btn.focus();
        }
    </script>
